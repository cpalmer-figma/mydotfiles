##### Terminal behavior #####

set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm-256color:Tc"

set -g mouse on
set -g history-limit 100000
set -s escape-time 10
set -g focus-events on
set -g set-clipboard on

##### Prefix key #####

unbind C-b
set -g prefix C-a
bind C-a send-prefix

##### Windows and panes #####

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# New windows and panes inherit the current working directory.
bind c new-window -c "#{pane_current_path}"

unbind %
unbind '"'
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Prefix + h/j/k/l selects a pane.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Navigate panes without the prefix, Alt+h/j/k/l
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Prefix + Shift-h/j/k/l resizes repeatedly.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Prefix + r reloads this file.
bind r source-file "$HOME/.tmux.conf" \; display-message "tmux config reloaded"

##### Status bar #####

set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-style "bg=#1f2335,fg=#a9b1d6"

set -g status-left-length 30
set -g status-left "#[fg=#7aa2f7,bold] #S "

setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[fg=#1f2335,bg=#7aa2f7,bold] #I:#W "

set -g status-right-length 80
set -g status-right '#[fg=#565f89]#H  #[fg=#bb9af7]#(TZ=America/New_York date "+%%Y-%%m-%%d  %%I:%%M %%p") '

set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"
set -g message-style "bg=#7aa2f7,fg=#1f2335,bold"

##### Session persistence #####

set -g @plugin "tmux-plugins/tpm"
set -g @plugin "tmux-plugins/tmux-sensible"
set -g @plugin "tmux-plugins/tmux-resurrect"

# Keep Continuum last because it extends status-right for autosaving.
set -g @plugin "tmux-plugins/tmux-continuum"
set -g @continuum-restore "on"
set -g @continuum-save-interval "10"
# Relaunch Codex/Claude on restore, resuming each pane's own conversation.
# The save hook rewrites those panes' saved commands to `ai-resume <tool> <id> <dir>`.
set -g @resurrect-hook-post-save-layout "/usr/bin/python3 $HOME/.tmux/scripts/ai-sessions-save"
set -g @resurrect-processes "$HOME/.tmux/scripts/ai-resume"

# TPM initialization must remain the final line.
run-shell "$HOME/.tmux/plugins/tpm/tpm"
